name: Netflix Catalog Enrich

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas
      - name: Enrich catalog with TMDB BI fields
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          cd projects/netflix-content-strategy-intelligence
          python enrich_catalog.py
      - name: Commit enriched data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add projects/netflix-content-strategy-intelligence/data/
          git diff --staged --quiet || (git commit -m "data: enrich Netflix catalog with BI fields $(date -u +%Y-%m-%d)" && git push)
