name: Daily TMDB Data Refresh

on:
  schedule:
    # Run daily at 06:00 UTC (1AM EST / 10PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests pandas
          
      - name: Fetch fresh TMDB data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          cd projects/netflix-content-strategy-intelligence
          python fetch_tmdb_data.py
          
      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add projects/netflix-content-strategy-intelligence/data/
          git diff --staged --quiet || (git commit -m "chore: daily TMDB data refresh $(date -u +%Y-%m-%d)" && git push)
