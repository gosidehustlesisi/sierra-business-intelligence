name: Execute Notebooks on Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install core execution dependencies
        run: |
          pip install --upgrade pip
          pip install papermill jupyter nbformat nbconvert \
            pandas numpy matplotlib seaborn plotly \
            scikit-learn xgboost lightgbm statsmodels \
            prophet nltk textblob vaderSentiment \
            requests beautifulsoup4 lxml wordcloud \
            duckdb

      - name: Install repo-specific dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt, installing..."
            pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            echo "Found pyproject.toml, installing..."
            pip install -e . || pip install . || echo "pyproject.toml install failed, continuing"
          fi

      - name: Fetch TMDB data for Netflix notebooks
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Check if we have Netflix notebooks that need TMDB data
          if [ -d "projects/netflix-content-strategy-intelligence/notebooks" ]; then
            echo "Found Netflix notebooks. Fetching TMDB data..."
            
            # Create data fetcher inline if script doesn't exist
            mkdir -p projects/netflix-content-strategy-intelligence/data
            
            python3 << 'FETCH_SCRIPT'
            import os, json, time, pandas as pd
            from pathlib import Path
            import requests
            
            API_KEY = os.environ.get("TMDB_API_KEY", "")
            if not API_KEY:
                print("WARNING: No TMDB_API_KEY set. Using demo mode with limited data.")
                API_KEY = "demo"
            
            BASE_URL = "https://api.themoviedb.org/3"
            
            def tmdb_get(endpoint, params=None):
                url = f"{BASE_URL}{endpoint}"
                default_params = {"api_key": API_KEY}
                if params:
                    default_params.update(params)
                try:
                    resp = requests.get(url, params=default_params, timeout=30)
                    if resp.status_code == 429:
                        time.sleep(1)
                        return tmdb_get(endpoint, params)
                    resp.raise_for_status()
                    return resp.json()
                except Exception as e:
                    print(f"  API error for {endpoint}: {e}")
                    return {"results": []}
            
            data_dir = Path("projects/netflix-content-strategy-intelligence/data")
            data_dir.mkdir(parents=True, exist_ok=True)
            
            # Fetch trending movies
            print("Fetching trending movies...")
            try:
                data = tmdb_get("/trending/movie/day")
                results = data.get("results", [])
                df = pd.DataFrame([{
                    "id": r["id"],
                    "title": r.get("title", ""),
                    "popularity": r.get("popularity", 0),
                    "vote_average": r.get("vote_average", 0),
                    "vote_count": r.get("vote_count", 0),
                    "release_date": r.get("release_date", ""),
                    "genre_ids": json.dumps(r.get("genre_ids", [])),
                } for r in results])
                df.to_csv(data_dir / "trending_movies_latest.csv", index=False)
                print(f"  ✓ trending_movies_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ trending_movies_latest.csv: {e}")
            
            # Fetch popular TV
            print("Fetching popular TV...")
            try:
                data = tmdb_get("/tv/popular")
                results = data.get("results", [])
                df = pd.DataFrame([{
                    "id": r["id"],
                    "name": r.get("name", ""),
                    "popularity": r.get("popularity", 0),
                    "vote_average": r.get("vote_average", 0),
                    "vote_count": r.get("vote_count", 0),
                    "first_air_date": r.get("first_air_date", ""),
                    "genre_ids": json.dumps(r.get("genre_ids", [])),
                } for r in results])
                df.to_csv(data_dir / "popular_tv_latest.csv", index=False)
                print(f"  ✓ popular_tv_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ popular_tv_latest.csv: {e}")
            
            # Fetch genres
            print("Fetching genres...")
            try:
                data = tmdb_get("/genre/movie/list")
                genres = data.get("genres", [])
                df = pd.DataFrame(genres)
                df.to_csv(data_dir / "movie_genres_latest.csv", index=False)
                print(f"  ✓ movie_genres_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ movie_genres_latest.csv: {e}")
            
            # Genre popularity
            print("Fetching genre popularity...")
            try:
                trending = tmdb_get("/trending/movie/day")
                results = trending.get("results", [])
                genre_counts = {}
                for r in results:
                    for gid in r.get("genre_ids", []):
                        genre_counts[gid] = genre_counts.get(gid, 0) + 1
                genres = tmdb_get("/genre/movie/list").get("genres", [])
                df = pd.DataFrame([{
                    "genre_id": g["id"],
                    "genre_name": g["name"],
                    "movie_count": genre_counts.get(g["id"], 0),
                } for g in genres])
                df.to_csv(data_dir / "genre_popularity_latest.csv", index=False)
                print(f"  ✓ genre_popularity_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ genre_popularity_latest.csv: {e}")
            
            # Upcoming movies
            print("Fetching upcoming movies...")
            try:
                data = tmdb_get("/movie/upcoming")
                results = data.get("results", [])
                df = pd.DataFrame([{
                    "id": r["id"],
                    "title": r.get("title", ""),
                    "popularity": r.get("popularity", 0),
                    "vote_average": r.get("vote_average", 0),
                    "release_date": r.get("release_date", ""),
                    "genre_ids": json.dumps(r.get("genre_ids", [])),
                } for r in results])
                df.to_csv(data_dir / "upcoming_movies_latest.csv", index=False)
                print(f"  ✓ upcoming_movies_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ upcoming_movies_latest.csv: {e}")
            
            # Top rated
            print("Fetching top rated movies...")
            try:
                data = tmdb_get("/movie/top_rated")
                results = data.get("results", [])
                df = pd.DataFrame([{
                    "id": r["id"],
                    "title": r.get("title", ""),
                    "popularity": r.get("popularity", 0),
                    "vote_average": r.get("vote_average", 0),
                    "vote_count": r.get("vote_count", 0),
                    "release_date": r.get("release_date", ""),
                    "genre_ids": json.dumps(r.get("genre_ids", [])),
                } for r in results])
                df.to_csv(data_dir / "top_rated_movies_latest.csv", index=False)
                print(f"  ✓ top_rated_movies_latest.csv ({len(df)} rows)")
            except Exception as e:
                print(f"  ✗ top_rated_movies_latest.csv: {e}")
            
            print("\nTMDB data fetch complete.")
            FETCH_SCRIPT
          else
            echo "No Netflix notebooks found. Skipping TMDB fetch."
          fi

      - name: Execute all notebooks
        id: execute
        run: |
          NOTEBOOKS=$(find . -name "*.ipynb" -not -path "*/.git/*" -not -path "*/site-packages/*" -not -path "*/venv/*" | sort)
          
          if [ -z "$NOTEBOOKS" ]; then
            echo "No notebooks found"
            echo "notebooks_found=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TOTAL=$(echo "$NOTEBOOKS" | wc -l)
          PASSED=0
          FAILED=0
          FAILED_LIST=""
          
          echo "Found $TOTAL notebooks to execute"
          echo "notebooks_found=$TOTAL" >> $GITHUB_OUTPUT
          
          for notebook in $NOTEBOOKS; do
            echo ""
            echo "=========================================="
            echo "Executing: $notebook"
            echo "=========================================="
            
            OUTPUT_DIR=$(dirname "$notebook")
            mkdir -p "$OUTPUT_DIR"
            
            # Execute with error capture but DON'T fail the whole workflow
            if papermill \
              --log-output \
              --no-progress-bar \
              --stdout-file /dev/null \
              --stderr-file /dev/null \
              "$notebook" \
              "$notebook" \
              2>&1; then
              echo "✅ PASSED: $notebook"
              PASSED=$((PASSED + 1))
            else
              echo "❌ FAILED: $notebook"
              FAILED=$((FAILED + 1))
              FAILED_LIST="$FAILED_LIST\n- $notebook"
              # Continue executing other notebooks
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "EXECUTION SUMMARY"
          echo "=========================================="
          echo "Total: $TOTAL"
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          
          echo "notebooks_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "notebooks_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "failed_list=$FAILED_LIST" >> $GITHUB_OUTPUT
          
          # Save values to environment file for later steps
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Upload executed notebooks as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-${{ github.run_id }}
          path: '**/*.ipynb'
          retention-days: 7

      - name: Commit executed notebooks back to repo
        # CRITICAL: Only commit if at least one notebook passed
        # This prevents overwriting executed notebooks with unexecuted skeletons
        if: env.PASSED > 0
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Stage only notebook files (not other changes)
          git add "**/*.ipynb"
          
          # Also stage any new data files that were fetched
          git add "**/*.csv" || true
          
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No notebook changes to commit"
            exit 0
          fi
          
          PASSED=${{ env.PASSED }}
          TOTAL=${{ env.TOTAL }}
          
          git commit -m "ci: Auto-execute notebooks [$PASSED/$TOTAL passed]"
          
          # Pull latest to avoid conflicts
          git pull --rebase origin main || true
          
          # Push back
          git push origin main

      - name: Report status
        if: always()
        run: |
          PASSED=${{ env.PASSED }}
          FAILED=${{ env.FAILED }}
          TOTAL=${{ env.TOTAL }}
          
          echo "## Notebook Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Notebooks Found | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED" -gt 0 ]; then
            echo "### ⚠️ Some notebooks failed" >> $GITHUB_STEP_SUMMARY
            echo "Failed notebooks were not committed." >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$PASSED" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ $PASSED notebooks executed and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ No notebooks passed — nothing committed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs for execution errors." >> $GITHUB_STEP_SUMMARY
          fi